# TLP 1.10 for ThinkPad X1 Carbon Gen 10 (Alder Lake)
# Profiles:
#   PRF performance   = *_ON_AC values   -> automatic on AC (rapid CPU ramp-up, max burst responsiveness)
#   BAL balanced      = *_ON_BAT values  (balanced efficiency)
#   SAV power-saver   = *_ON_SAV values  -> automatic on battery (maximum battery saving)

TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=SAV
TLP_PROFILE_DEFAULT=PRF

# CPU scaling & governors
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# CPU energy/performance preference (EPP)
# On AC (PRF): performance (EPP 0) instructs Intel HWP to ramp clock to max turbo immediately on any load.
# On SAV: power minimizes power consumption and extends battery life.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Intel Energy-Performance Bias (EPB)
CPU_ENERGY_PERF_BIAS_ON_AC=performance
CPU_ENERGY_PERF_BIAS_ON_BAT=balance_performance
CPU_ENERGY_PERF_BIAS_ON_SAV=power

# Turbo boost
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Hardware P-state dynamic boost
# Boosts CPU frequency to max immediately on waking from I/O and user events.
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=1
CPU_HWP_DYN_BOOST_ON_SAV=0

# CPU performance limits (0-100%)
# Min 30% (~1.3 GHz) on AC eliminates the 400 MHz low-frequency step-up latency,
# while Core C-states (C6/C7) still ensure cold idle and silent fans.
CPU_MIN_PERF_ON_AC=30
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=60

# ThinkPad platform profiles (firmware fan and power limit curves)
# AC: balanced keeps fans low/silent while maintaining 20-28W capacity.
# SAV: low-power prioritizes battery efficiency and cool operation.
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Intel Iris Xe graphics
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MAX_FREQ_ON_AC=1200
INTEL_GPU_BOOST_FREQ_ON_AC=1200
INTEL_GPU_MIN_FREQ_ON_BAT=100
INTEL_GPU_MAX_FREQ_ON_BAT=1200
INTEL_GPU_BOOST_FREQ_ON_BAT=1200
INTEL_GPU_MIN_FREQ_ON_SAV=100
INTEL_GPU_MAX_FREQ_ON_SAV=800
INTEL_GPU_BOOST_FREQ_ON_SAV=800

# PCIe ASPM
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
PCIE_ASPM_ON_SAV=powersupersave

# Runtime power management
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ON_SAV=auto
RUNTIME_PM_DRIVER_DENYLIST=""

# Radios & Audio
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
WIFI_PWR_ON_SAV=on
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_ON_SAV=1
SOUND_POWER_SAVE_CONTROLLER=Y
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_AUDIO=0
NMI_WATCHDOG=0
