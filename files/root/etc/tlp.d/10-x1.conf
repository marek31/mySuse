# TLP 1.10 for ThinkPad X1 Carbon Gen 10 (Alder Lake)
# Profiles:
#   PRF performance   = *_ON_AC values   (maximum performance when explicitly requested)
#   BAL balanced      = *_ON_BAT values  -> default on AC & balanced mode (rapid CPU ramp-up, cold idle)
#   SAV power-saver   = *_ON_SAV values  -> automatic on battery (maximum power saving)

TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV
TLP_PROFILE_DEFAULT=BAL

# CPU scaling & governors (intel_pstate active)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# CPU energy/performance preference (EPP)
# balance_performance provides instant turbo ramp-up on load while allowing deep C-states at idle.
# power minimizes power consumption and extends battery life.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Intel Energy-Performance Bias (EPB)
CPU_ENERGY_PERF_BIAS_ON_AC=balance_performance
CPU_ENERGY_PERF_BIAS_ON_BAT=balance_performance
CPU_ENERGY_PERF_BIAS_ON_SAV=power

# Turbo boost
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Hardware P-state dynamic boost
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# CPU performance limits (0-100%)
# Min 0 allows CPU cores to downclock to 400 MHz idle floor, saving substantial power at idle.
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=60

# ThinkPad platform profiles (firmware fan and power limit curves via thinkpad_acpi)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Intel Iris Xe graphics (min 100MHz allows GPU to drop into low-power RC6 at idle)
INTEL_GPU_MIN_FREQ_ON_AC=100
INTEL_GPU_MAX_FREQ_ON_AC=1200
INTEL_GPU_BOOST_FREQ_ON_AC=1200
INTEL_GPU_MIN_FREQ_ON_BAT=100
INTEL_GPU_MAX_FREQ_ON_BAT=1200
INTEL_GPU_BOOST_FREQ_ON_BAT=1200
INTEL_GPU_MIN_FREQ_ON_SAV=100
INTEL_GPU_MAX_FREQ_ON_SAV=800
INTEL_GPU_BOOST_FREQ_ON_SAV=800

# PCIe ASPM (powersupersave enforces L1 sub-states for bus power gating)
PCIE_ASPM_ON_AC=powersave
PCIE_ASPM_ON_BAT=powersupersave
PCIE_ASPM_ON_SAV=powersupersave

# Runtime power management
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ON_SAV=auto
RUNTIME_PM_DRIVER_DENYLIST=""

# Radios & Audio
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
WIFI_PWR_ON_SAV=on
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_ON_SAV=1
SOUND_POWER_SAVE_CONTROLLER=Y
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_AUDIO=0
NMI_WATCHDOG=0
