# Hardware video acceleration for Intel Iris Xe / VA-API on Wayland
hwdec=vaapi
vo=gpu
gpu-context=wayland
keep-open=yes
save-position-on-quit=yes
write-filename-in-watch-later-config=yes
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"

# Suppress harmless upstream FFmpeg non-fatal warnings (e.g. late SEI notices)
msg-level=ffmpeg=error
