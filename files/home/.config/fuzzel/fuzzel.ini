# Fuzzel application launcher configuration for mySuse
[main]
font=Inter:size=11
prompt="❯ "
icon-theme=Papirus-Dark
icons=yes
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
width=36
lines=10
horizontal-pad=18
vertical-pad=12
inner-pad=6

[colors]
background=1a1b26f2
text=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7dcfff00
border=7aa2f7ff

[border]
width=1
radius=8
