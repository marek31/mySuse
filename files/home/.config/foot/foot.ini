# foot terminal configuration
[main]
include=~/.config/foot/themes/noctalia
shell=fish
font=JetBrains Mono:size=11, Symbols Nerd Font Mono:size=11
pad=14x12 center
dpi-aware=no
selection-target=both

[scrollback]
lines=20000
multiplier=5.0
indicator-position=relative

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=no
alternate-scroll-mode=yes

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+v Control+Shift+v XF86Paste
primary-paste=Shift+Insert
show-urls-launch=Control+Shift+o
scrollback-up-page=Page_Up Shift+Page_Up
scrollback-down-page=Page_Down Shift+Page_Down
scrollback-up-half-page=Control+Page_Up
scrollback-down-half-page=Control+Page_Down
scrollback-up-line=Control+Up Shift+Up
scrollback-down-line=Control+Down Shift+Down

[mouse-bindings]
clipboard-paste=Control+BTN_MIDDLE
select-begin-block=none
select-extend-character-wise=none
show-urls-launch=Control+BTN_LEFT Control+BTN_RIGHT

[url]
launch=foot-open ${url}
osc8-underline=always
style=single
regex=((https?://|mailto:|ftp://|file:|ssh:|ssh://|git://)[^[:space:]()<>]+|(/|~/)[a-zA-Z0-9_.~-]+(/[a-zA-Z0-9_.~-]+)*(:[0-9]+(:[0-9]+)?)?)

[colors-dark]
alpha=1.0
