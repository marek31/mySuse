# foot terminal configuration
[main]
shell=fish
font=JetBrains Mono:size=11, Symbols Nerd Font Mono:size=11
pad=14x12 center
dpi-aware=no
selection-target=both

[scrollback]
lines=20000
multiplier=5.0
indicator-position=relative

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=no
alternate-scroll-mode=yes

[key-bindings]
scrollback-up-page=Page_Up Shift+Page_Up
scrollback-down-page=Page_Down Shift+Page_Down
scrollback-up-half-page=Control+Page_Up
scrollback-down-half-page=Control+Page_Down
scrollback-up-line=Control+Up Shift+Up
scrollback-down-line=Control+Down Shift+Down

[colors-dark]
alpha=1.0
